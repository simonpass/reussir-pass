<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Annales PASS">
<title>Annales PASS</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;1,8..60,500&display=swap">
<style>
/* Layout: exam-platform shell — blue top bar, left rail (timer, progress, question list), stacked question cards. */
:root {
  --bg: #eef2f5;
  --surface: #ffffff;
  --surface-2: #f5f8fa;
  --fg: #23323d;
  --muted: #637784;
  --line: #d7e0e6;
  --brand: #1d5d82;
  --brand-ink: #ffffff;
  --brand-2: #164a69;
  --action: #f0861e;
  --action-ink: #ffffff;
  --ok: #2f9e5b;
  --ok-soft: #e3f4e9;
  --bad: #d64545;
  --bad-soft: #fbe6e6;
  --mid: #e8962a;
  --mid-soft: #fdf1df;
  --sel: #e5f0f7;
  --font: "Plus Jakarta Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --shadow: 0 1px 2px rgba(20, 50, 70, .08), 0 2px 8px rgba(20, 50, 70, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181d; --surface: #1a242b; --surface-2: #1f2b33; --fg: #e3eaef; --muted: #93a6b2; --line: #2e3d47;
    --brand: #2a6f98; --brand-2: #1d5577; --action: #e98b2c; --ok: #4cbf7a; --ok-soft: #173326; --bad: #ef6b6b;
    --bad-soft: #3a1f22; --mid: #f0a54a; --mid-soft: #382b17; --sel: #213645; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181d; --surface: #1a242b; --surface-2: #1f2b33; --fg: #e3eaef; --muted: #93a6b2; --line: #2e3d47;
  --brand: #2a6f98; --brand-2: #1d5577; --action: #e98b2c; --ok: #4cbf7a; --ok-soft: #173326; --bad: #ef6b6b;
  --bad-soft: #3a1f22; --mid: #f0a54a; --mid-soft: #382b17; --sel: #213645; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 17px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--brand); }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, .item:focus-within, a:focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--brand); color: var(--brand-ink); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 54px; padding-block: 6px; }
.topbar h1 { font-size: 18px; font-weight: 600; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { background: transparent; border: 0; color: var(--brand-ink); width: 44px; height: 44px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.iconbtn:active { background: rgba(255,255,255,.15); }
.iconbtn svg { width: 24px; height: 24px; }
.subbar { background: var(--brand-2); color: var(--brand-ink); font-size: 15px; }
.subbar .wrap { display: flex; gap: 6px; padding-block: 0; overflow-x: auto; }
.tab { padding: 10px 14px; border: 0; background: transparent; color: rgba(255,255,255,.8); border-bottom: 3px solid transparent; white-space: nowrap; }
.tab.on { color: #fff; border-bottom-color: var(--action); font-weight: 600; }

/* home */
.home { max-width: 1100px; margin: 0 auto; padding-block: 24px 60px; display: grid; gap: 28px; }
.hero { display: grid; gap: 6px; }
.hero h2 { font-size: 28px; margin: 0; text-wrap: balance; }
.hero p { margin: 0; color: var(--muted); max-width: 65ch; }
.modes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.uepick { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 10px; margin: 4px 0 18px; }
.uepick button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 64px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); box-shadow: var(--shadow); text-align: left; transition: transform .12s ease, background .15s ease; }
.uepick button b { font-size: 20px; }
.uepick button span { font-size: 13px; color: var(--muted); }
.uepick button:active { transform: scale(.97); }
.uepick button.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.uepick button.on span { color: var(--brand-ink); opacity: .85; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 9px 16px; border-radius: 7px; font-weight: 600; color: var(--muted); min-height: 44px; }
.seg button.on { background: var(--brand); color: var(--brand-ink); }
.modehelp { color: var(--muted); font-size: 15px; flex: 1 1 260px; }
.group h3 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 700; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.exam { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; text-align: left; display: grid; gap: 6px; box-shadow: var(--shadow); min-height: 112px; align-content: start; }
.exam:active { transform: scale(.99); }
.exam .t { font-weight: 700; font-size: 18px; line-height: 1.25; }
.exam .m { color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.exam .best { font-variant-numeric: tabular-nums; font-weight: 600; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--sel); color: var(--brand); }
.pill.resume { background: var(--mid-soft); color: var(--mid); }
.random { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 14px 16px; }
.random .lbl { flex: 1 1 220px; }
.note-src { color: var(--muted); font-size: 14px; max-width: 75ch; }

/* exam layout */
.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 20px; max-width: 1240px; margin: 0 auto; padding-block: 18px 80px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 66px); display: grid; gap: 12px; max-height: calc(100vh - 90px); overflow: auto; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; box-shadow: var(--shadow); }
.who { font-weight: 600; font-size: 15px; display: flex; gap: 8px; align-items: center; color: var(--muted); }
.timer { font-variant-numeric: tabular-nums; font-size: 15px; color: var(--muted); margin: 6px 0 8px; }
.timer b { color: var(--fg); }
.prog { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--brand); width: 0; transition: width .25s; }
.btn { border: 0; border-radius: 6px; padding: 10px 16px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.orange { background: var(--action); color: var(--action-ink); }
.btn.blue { background: var(--brand); color: var(--brand-ink); }
.btn.ghost { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.btn.block { width: 100%; margin-top: 10px; }
.btn[disabled] { opacity: .5; }
.qlist { display: grid; gap: 2px; font-size: 15px; }
.qlist .sec { font-size: 13px; font-weight: 700; color: var(--muted); display: flex; justify-content: space-between; padding: 2px 4px 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.qlink { background: transparent; border: 0; text-align: left; padding: 7px 8px; border-left: 4px solid transparent; border-radius: 0 6px 6px 0; display: flex; justify-content: space-between; gap: 8px; min-height: 38px; align-items: center; }
.qlink:active { background: var(--sel); }
.qlink.saved { border-left-color: var(--ok); }
.qlink.unsaved { color: var(--bad); }
.qlink.res-ok { border-left-color: var(--ok); }
.qlink.res-mid { border-left-color: var(--mid); }
.qlink.res-bad { border-left-color: var(--bad); color: var(--bad); }
.qlink.res-na { border-left-color: var(--line); color: var(--muted); }
.qlink small { font-variant-numeric: tabular-nums; color: var(--muted); }

.main { min-width: 0; display: grid; gap: 22px; }
.main > h2 { font-weight: 400; font-size: 28px; margin: 6px 0 0; }
.intro { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; white-space: pre-wrap; }

/* question card */
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); scroll-margin-top: 80px; overflow: hidden; }
.qh { background: var(--brand); color: var(--brand-ink); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding: 9px 14px; font-weight: 700; font-size: 16px; align-items: center; }
.qh .ty { font-style: italic; font-weight: 600; font-size: 14px; }
.qh .num { display: inline-flex; align-items: center; gap: 8px; }
.qh .num svg { width: 18px; height: 18px; }
.q.r-ok .qh { background: var(--ok); }
.q.r-mid .qh { background: var(--action); }
.q.r-bad .qh { background: var(--bad); }
.q.r-na .qh { background: var(--muted); }
.ptsbadge { background: rgba(255,255,255,.25); border-radius: 99px; padding: 1px 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
.qb { padding: 14px 16px 16px; display: grid; gap: 12px; }
.ctx { background: var(--surface-2); border-left: 4px solid var(--brand); padding: 10px 12px; white-space: pre-wrap; border-radius: 0 6px 6px 0; }
.stem { white-space: pre-wrap; font-weight: 600; }
.figs { display: grid; gap: 10px; }
.figs img { display: block; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 4px; background: #fff; cursor: zoom-in; margin: 0 auto; }
.clear { justify-self: end; background: transparent; border: 0; color: var(--muted); font-size: 14px; text-decoration: underline; padding: 6px 4px; min-height: 36px; }
.items { display: grid; border-top: 1px solid var(--line); }
.item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 10px; border-bottom: 1px solid var(--line); cursor: pointer; -webkit-tap-highlight-color: transparent; min-height: 52px; }
.item.on { background: var(--sel); }
.item .L { font-weight: 700; min-width: 2.2ch; color: var(--muted); padding-top: 1px; }
.item .tx { flex: 1; min-width: 0; white-space: pre-wrap; }
.item input { position: absolute; opacity: 0; pointer-events: none; }
.box { width: 24px; height: 24px; flex: none; border: 2px solid var(--muted); border-radius: 5px; display: grid; place-items: center; margin-top: 0; background: var(--surface); }
.box.round { border-radius: 50%; }
.item.on .box { border-color: var(--brand); background: var(--brand); }
.box svg { width: 16px; height: 16px; color: #fff; display: none; }
.item.on .box svg { display: block; }
.box.round i { width: 10px; height: 10px; border-radius: 50%; background: #fff; display: none; }
.item.on .box.round i { display: block; }
.items.locked .item { cursor: default; }
.qf { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.stat { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 4px; display: inline-flex; gap: 6px; align-items: center; }
.stat.no { background: var(--bad); color: #fff; }
.stat.yes { background: var(--ok); color: #fff; }

/* correction */
.verdict { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; padding: 9px 12px; border-radius: 4px; font-weight: 600; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.mid { background: var(--mid-soft); color: var(--mid); }
.verdict.bad { background: var(--bad-soft); color: var(--bad); }
.verdict.na { background: var(--surface-2); color: var(--muted); }
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
table.cor { border-collapse: collapse; width: 100%; font-size: 15px; min-width: 520px; }
table.cor th { background: var(--surface-2); font-size: 13px; text-align: center; padding: 8px 6px; font-weight: 700; border-bottom: 1px solid var(--line); }
table.cor td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: top; }
table.cor tr:last-child td { border-bottom: 0; }
table.cor td.txt { text-align: left; white-space: pre-wrap; }
table.cor td.L { font-weight: 700; color: var(--muted); }
td.dis-yes { background: var(--bad-soft); color: var(--bad); font-weight: 700; }
td.dis-no { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.ck { width: 18px; height: 18px; display: inline-grid; place-items: center; border: 2px solid var(--muted); border-radius: 4px; vertical-align: middle; }
.ck.on { background: var(--brand); border-color: var(--brand); }
.ck.on svg { width: 13px; height: 13px; color: #fff; }
.detail { display: grid; gap: 8px; }
.detail h4 { margin: 4px 0 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.dl { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 6px 10px; align-items: baseline; }
.vf { font-weight: 700; font-size: 14px; white-space: nowrap; }
.vf.V { color: var(--ok); }
.vf.F { color: var(--bad); }
.dl .tx { white-space: pre-wrap; }
.general { white-space: pre-wrap; background: var(--surface-2); padding: 10px 12px; border-radius: 6px; }
.notes { font-size: 14px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; white-space: pre-wrap; }
.annul { background: var(--mid-soft); color: var(--mid); font-weight: 700; padding: 6px 10px; border-radius: 4px; }
.scorehead { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: baseline; box-shadow: var(--shadow); }
.scorehead .big { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
.scorehead .big small { font-size: 18px; color: var(--muted); font-weight: 600; }
.scorehead .s { color: var(--muted); font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* overlays */
.modal { position: fixed; inset: 0; background: rgba(10, 25, 35, .5); display: grid; place-items: center; z-index: 50; padding: 16px; }
.dialog { background: var(--surface); border-radius: 10px; max-width: 480px; width: 100%; padding: 20px; display: grid; gap: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.dialog h3 { margin: 0; font-size: 20px; }
.dialog .row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.loading { max-width: 560px; margin: 40px auto; display: grid; gap: 10px; text-align: center; }
.loading .info { background: var(--sel); padding: 10px; border-radius: 4px; color: var(--brand); }
.loading .ok { background: var(--ok-soft); padding: 10px; border-radius: 4px; color: var(--ok); }
.stripe { height: 14px; border-radius: 4px; background: repeating-linear-gradient(-45deg, var(--brand) 0 12px, #4f8db3 12px 24px); background-size: 34px 34px; animation: mv 1s linear infinite; }
@keyframes mv { to { background-position: 34px 0; } }
.zoom { position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 60; overflow: auto; display: grid; place-items: center; padding: 20px; }
.zoom img { max-width: none; width: min(1400px, 180vw); background: #fff; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 70; font-weight: 600; }

/* micro-animations : courtes, pour garder le rythme */
.item { transition: background-color .12s ease; }
.item:active { background: var(--sel); }
.item.pop .box { animation: pop .18s ease-out; }
@keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.box { transition: background-color .12s, border-color .12s; }
.btn { transition: transform .08s ease, filter .12s; }
.btn:active, .exam:active, .qlink:active, .chip:active { transform: scale(.97); }
.stat { transition: background-color .15s; }
.stat.flash { animation: flash .35s ease-out; }
@keyframes flash { 0% { transform: translateY(4px); opacity: .3; } 100% { transform: none; opacity: 1; } }
.q.reveal .qh { animation: hdr .25s ease-out; }
@keyframes hdr { from { filter: brightness(1.5) saturate(.5); } to { filter: none; } }
.q.reveal .verdict, .q.reveal .tblwrap, .q.reveal .detail { animation: slidein .22s ease-out both; }
.q.reveal .tblwrap { animation-delay: .04s; } .q.reveal .detail { animation-delay: .08s; }
@keyframes slidein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.q.shake { animation: shake .25s ease; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.scorehead .big { display: inline-block; animation: slidein .25s ease-out both; }
.scorehead .bravo { align-self: center; background: var(--ok-soft); color: var(--ok); font-weight: 700; font-size: 20px; letter-spacing: .02em; padding: 6px 14px; border-radius: 999px; animation: bravo .45s .55s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes bravo { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .scorehead .bravo { animation: none; } }
.qlink { transition: border-color .15s, color .15s; }
.main > .q { animation: slidein .2s ease-out both; }
.toast { animation: slidein .15s ease-out; }

/* révisions */
.revpanel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.kpis div { display: grid; }
.kpis b { font-size: 26px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kpis span { color: var(--muted); font-size: 14px; }
.bar.big { height: 10px; }
.search { display: grid; gap: 6px; }
.searchrow { display: flex; gap: 8px; }
.searchrow input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); min-height: 44px; }
.kbd { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.4; }

/* import */
.examwrap { position: relative; display: grid; }
.examwrap .exam { padding-right: 16px; }
.del { position: absolute; right: 8px; bottom: 8px; background: transparent; border: 0; color: var(--bad); font-size: 13px; font-weight: 600; padding: 6px 8px; min-height: 32px; }
.addcard { border: 2px dashed var(--line); background: var(--surface-2); box-shadow: none; }
.addcard .t { color: var(--brand); }
.drop { display: grid; gap: 6px; place-items: center; text-align: center; padding: 36px 16px; border: 2px dashed var(--brand); border-radius: 12px; background: var(--surface); cursor: pointer; transition: background-color .12s; }
.drop.over { background: var(--sel); }
.drop .t { font-size: 20px; font-weight: 700; color: var(--brand); }
.drop .m { color: var(--muted); font-size: 15px; }
.drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.impstat { background: var(--sel); color: var(--brand); padding: 10px 12px; border-radius: 6px; font-weight: 600; }
.impstat.err { background: var(--bad-soft); color: var(--bad); }
.impstat.warn { background: var(--mid-soft); color: var(--mid); font-weight: 500; font-size: 14px; }
.impform { display: grid; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.impform label { font-weight: 700; font-size: 14px; }
.impform input { font: inherit; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); min-height: 44px; width: 100%; }
.aibox { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.revlist { display: grid; gap: 12px; }
.rev { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.revh { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.revh .linkbtn { margin-left: auto; }
.revitems { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 4px; font-size: 15px; }
.ansrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 14px; font-weight: 600; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; padding: 4px 12px; min-height: 36px; min-width: 40px; font-weight: 700; transition: background-color .12s, transform .08s; }
.chip.on { background: var(--ok); color: #fff; border-color: var(--ok); }
.linkbtn { background: transparent; border: 0; color: var(--bad); text-decoration: underline; font-size: 14px; min-height: 36px; }

/* ===== Thème 2 : plus doux, une couleur par UE ===== */
:root {
  --brand: #2457c5;
  --bg: #f3f5fa; --surface: #ffffff; --surface-2: #f1f4f9; --fg: #1b2333; --muted: #5c6a80; --line: #e2e7ef;
  --brand-2: color-mix(in srgb, var(--brand) 78%, #000);
  --brand-soft: color-mix(in srgb, var(--brand) 9%, var(--surface));
  --sel: color-mix(in srgb, var(--brand) 10%, var(--surface));
  --action: #f2711c; --ok: #1f9a5a; --ok-soft: #e4f6ec; --bad: #d93d4a; --bad-soft: #fde8ea; --mid: #e08a12; --mid-soft: #fdf1dc;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 6px 18px rgba(16, 24, 40, .06);
  --shadow-up: 0 2px 4px rgba(16, 24, 40, .06), 0 14px 30px rgba(16, 24, 40, .10);
}
:root[data-ue="UE1"] { --brand: #0e7a70; }
:root[data-ue="UE2"] { --brand: #6a35d6; }
:root[data-ue="UE4"] { --brand: #2457c5; }

:root[data-ue="UE6"] { --brand: #b3560c; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131d; --surface: #161d2b; --surface-2: #1c2435; --fg: #e7ecf4; --muted: #97a3b8; --line: #283246;
    --brand-2: color-mix(in srgb, var(--brand) 78%, #000); --brand-soft: color-mix(in srgb, var(--brand) 22%, var(--surface)); --sel: color-mix(in srgb, var(--brand) 26%, var(--surface));
    --ok: #3fc07c; --ok-soft: #13301f; --bad: #f06b74; --bad-soft: #3a1c22; --mid: #f2a43c; --mid-soft: #36290f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); --shadow-up: 0 14px 30px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #0e131d; --surface: #161d2b; --surface-2: #1c2435; --fg: #e7ecf4; --muted: #97a3b8; --line: #283246;
  --brand-2: color-mix(in srgb, var(--brand) 78%, #000); --brand-soft: color-mix(in srgb, var(--brand) 22%, var(--surface)); --sel: color-mix(in srgb, var(--brand) 26%, var(--surface));
  --ok: #3fc07c; --ok-soft: #13301f; --bad: #f06b74; --bad-soft: #3a1c22; --mid: #f2a43c; --mid-soft: #36290f;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); --shadow-up: 0 14px 30px rgba(0,0,0,.4);
}
body { font-size: 16.5px; letter-spacing: -.003em; background:
  radial-gradient(1200px 500px at 100% -10%, color-mix(in srgb, var(--brand) 10%, transparent), transparent 70%), var(--bg); background-attachment: fixed; }

/* accueil */
.home { gap: 26px; padding-block: 24px 70px; }
.uepick { gap: 12px; margin: 0; }
.uepick button { --c: #2457c5; border-radius: var(--radius); padding: 14px 16px; min-height: 78px; gap: 4px; border: 1px solid var(--line); box-shadow: var(--shadow); position: relative; overflow: hidden; transition: transform .15s ease, box-shadow .15s ease, background .2s; }
.uepick button[data-ue="UE1"] { --c: #0e7a70; } .uepick button[data-ue="UE2"] { --c: #6a35d6; } .uepick button[data-ue="UE4"] { --c: #2457c5; } .uepick button[data-ue="UE5"] { --c: #c0266b; } .uepick button[data-ue="UE6"] { --c: #b3560c; }

.viewtabs { border-radius: 99px; padding: 5px; }

.hero { background: linear-gradient(135deg, var(--brand-soft), var(--surface) 75%); border: 1px solid var(--line); border-radius: 20px; padding: 24px 26px; gap: 8px; box-shadow: var(--shadow); position: relative; overflow: hidden; }

/* boutons */
.btn { border-radius: 12px; font-weight: 700; padding: 10px 18px; }

/* épreuve */
.layout { gap: 24px; }
.panel { border-radius: var(--radius); padding: 14px; }
.qlink { border-radius: 0 10px 10px 0; }
@media (hover: hover) { .qlink:hover { background: var(--sel); } }
.main > h2 { font-weight: 800; font-size: 26px; }

.item .L { color: var(--brand); }

.impgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }

/* araignée de compétences */
.skill { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius, 12px); box-shadow: var(--shadow); padding: 16px; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px 18px; align-items: center; }

.skill .frame { fill: var(--surface); stroke: var(--fg); stroke-width: 1.5; stroke-linejoin: round; }

.sc-rank.rS { color: #d99a00; } .sc-rank.rA { color: var(--ok); } .sc-rank.rB { color: #2f7fd0; }

@media (max-width: 640px) { .skill { grid-template-columns: minmax(0, 1fr); } .skillcard { grid-template-columns: auto auto auto; column-gap: 12px; align-items: center; } .sc-scale { display: none; } .sc-lbl { margin: 0; } }

/* flashcards */

/* banque de QCM */

.m3d-days { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x mandatory; }
.m3d-days button { flex: 0 0 auto; scroll-snap-align: start; display: grid; gap: 1px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 12px; min-height: 52px; min-width: 120px; }
.m3d-days button b { font-size: 16px; } .m3d-days button span { font-size: 12.5px; color: var(--muted); }
.m3d-days button.on { background: var(--brand); border-color: var(--brand); color: #fff; } .m3d-days button.on span { color: #fff; opacity: .9; }
.m3d-info { background: var(--brand-soft, var(--surface)); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px; min-height: 70px; }
.m3d-info b { font-size: 16.5px; } .m3d-info span { color: var(--fg); white-space: pre-wrap; }
.m3d-legend { display: flex; flex-wrap: wrap; gap: 6px; }
.m3d-legend button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; min-height: 38px; font-size: 14px; }
.m3d-legend button i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.m3d-legend button.on { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand) inset; }

/* déménagement */
.movebar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; max-width: 1100px; margin: 16px auto 0; padding-block: 14px; background: var(--mid-soft); border: 1px solid color-mix(in srgb, var(--mid) 40%, var(--line)); border-radius: 14px; }
.movebar div { display: grid; gap: 3px; flex: 1 1 320px; } .movebar span { font-size: 14.5px; color: var(--fg); }

.m3d-facts, .m3d-traps { margin-top: 8px; display: grid; gap: 4px; }
.m3d-facts h5, .m3d-traps h5, .m3d-side h4 { margin: 4px 0 2px; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); }
.m3d-traps h5 { color: var(--bad); }
.m3d-facts ul, .m3d-traps ul, .m3d-ann ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.m3d-facts li small, .m3d-traps li small, .m3d-ann li small, .m3d-figs figcaption small { display: block; color: var(--muted); font-size: 12px; }
.m3d-traps s { color: var(--muted); }
.m3d-side { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.m3d-side section { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; }
.m3d-figs figure { margin: 0; display: grid; gap: 4px; }
.m3d-figs img { width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); background: #fff; cursor: zoom-in; }
.m3d-figs figcaption { font-size: 14px; }
.m3d-ann li { font-size: 14.5px; }
.m3d-zoom { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.85); display: grid; place-items: center; padding: 16px; overflow: auto; }
.m3d-zoom img { max-width: 100%; max-height: 100%; background: #fff; border-radius: 8px; }
.frise { display: grid; gap: 18px; }
.frise-wk h4 { margin: 0 0 8px; font-size: 15px; color: var(--brand); letter-spacing: .04em; text-transform: uppercase; }
.frise-wk ol { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 3px solid var(--brand); display: grid; gap: 8px; }
.frise-wk > ol > li { position: relative; }
.frise-wk > ol > li::before { content: ''; position: absolute; left: -25px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 3px solid var(--brand); }
.frise-wk details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.frise-wk summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; min-height: 30px; list-style: none; }
.frise-wk summary::-webkit-details-marker { display: none; }
.frise-wk summary b { flex: none; min-width: 72px; color: var(--brand); font-variant-numeric: tabular-nums; }
.frise-wk details[open] summary { margin-bottom: 8px; }
.frise-wk ul { margin: 0 0 10px; padding-left: 18px; display: grid; gap: 6px; font-size: 14.5px; }
.frise-wk ul small { display: block; color: var(--muted); font-size: 12px; }
@media (max-width: 760px) { .m3d-side { grid-template-columns: minmax(0, 1fr); } }
.hcoupe { max-width: 900px; margin: 0 auto; padding-block: 14px 60px; display: grid; gap: 14px; }
.hfig { margin: 0; display: grid; gap: 6px; }
.hfig img { width: 100%; max-height: 62vh; object-fit: contain; background: #fff; border-radius: 14px; border: 1px solid var(--line); cursor: zoom-in; }
.hfig figcaption { font-size: 13px; color: var(--muted); }
.hq, .hans { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 8px; }
.hq .btn { justify-self: start; }
.hans h4 { margin: 0; font-size: 20px; color: var(--brand); }
.hans h5 { margin: 6px 0 0; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); }
.hans dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; }
.hans dt { color: var(--muted); font-size: 14px; } .hans dd { margin: 0; }
.hans ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
/* ---------- écrans de chargement ---------- */
.splash { min-height: calc(100vh - 120px); display: grid; place-content: center; justify-items: center; gap: 12px; padding: 32px 16px; text-align: center; }
.splash-mark { width: 84px; height: 84px; border-radius: 24px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: 0 10px 30px color-mix(in srgb, var(--brand) 35%, transparent); animation: splashPulse 1.6s ease-in-out infinite; }
.splash-mark svg { width: 48px; height: 48px; }
.splash-name { font-size: 26px; font-weight: 800; color: var(--fg); letter-spacing: -.01em; }
.splash-step { color: var(--muted); font-size: 15px; min-height: 1.4em; }
.splash-bar { width: min(280px, 70vw); height: 8px; border-radius: 99px; overflow: hidden; background: color-mix(in srgb, var(--brand) 12%, var(--surface-2)); }
.splash-bar i { display: block; height: 100%; width: 8%; border-radius: inherit; background: linear-gradient(90deg, var(--brand), var(--action)); transition: width .35s ease; }
.splash-tip { color: var(--muted); font-size: 13px; max-width: 34ch; margin-top: 6px; }
@keyframes splashPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.loader { display: grid; justify-items: center; align-content: center; gap: 12px; color: var(--muted); font-size: 15px; text-align: center; padding: 16px; }
.loader::before { content: ''; width: 44px; height: 44px; border-radius: 50%; border: 4px solid color-mix(in srgb, var(--brand) 18%, transparent); border-top-color: var(--brand); border-right-color: var(--action); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.m3d-load { gap: 12px; align-content: center; justify-items: center; text-align: center; font-size: 15px; }
.m3d-load::before { content: ''; width: 48px; height: 48px; border-radius: 50%; border: 4px solid color-mix(in srgb, var(--brand) 18%, transparent); border-top-color: var(--brand); border-right-color: var(--action); animation: spin .9s linear infinite; }
.m3d-load.err::before { display: none; }
.hfig img { min-height: 220px; background: linear-gradient(100deg, var(--surface-2) 30%, color-mix(in srgb, var(--brand) 10%, var(--surface-2)) 50%, var(--surface-2) 70%) 0 0 / 200% 100%; animation: shimmer 1.3s linear infinite; }
.hfig img.ok { min-height: 0; animation: none; background: #fff; }
@keyframes shimmer { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .splash-mark, .loader::before, .m3d-load::before, .hfig img { animation: none; } }
/* ---------- menu (bouton ☰ en haut à gauche) ---------- */
.viewtabs { display: none !important; }
.topbar .wrap:has(#homeBtn:not([hidden])) #navBtn { display: none; }
.navbtn svg { width: 26px; height: 26px; }
.drawer { position: fixed; inset: 0; z-index: 90; pointer-events: none; }
.drawer-scrim { position: absolute; inset: 0; background: rgba(8, 14, 22, .45); opacity: 0; transition: opacity .3s var(--ease-out); }
.drawer-panel { position: absolute; top: 0; bottom: 0; left: 0; width: min(320px, 84vw); background: var(--surface); box-shadow: 8px 0 40px rgba(0, 0, 0, .25); transform: translateX(-104%); transition: transform .38s var(--ease-out); display: grid; grid-template-rows: auto 1fr auto; padding: calc(env(safe-area-inset-top, 0px) + 14px) 12px calc(env(safe-area-inset-bottom, 0px) + 14px); border-radius: 0 22px 22px 0; }
.drawer.open { pointer-events: auto; }
.drawer.open .drawer-scrim { opacity: 1; }
.drawer.open .drawer-panel { transform: none; }
.drawer-head { display: flex; align-items: center; gap: 12px; padding: 4px 8px 16px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.drawer-head .splash-mark { width: 44px; height: 44px; border-radius: 13px; animation: none; box-shadow: none; } .drawer-head .splash-mark svg { width: 26px; height: 26px; }
.drawer-head b { font-size: 18px; font-weight: 800; } .drawer-head small { display: block; color: var(--muted); font-size: 12.5px; }
.drawer nav { display: grid; gap: 4px; align-content: start; overflow-y: auto; }
.drawer nav button { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 10px 14px; border: 0; border-radius: 14px; background: transparent; color: var(--fg); font-size: 16px; font-weight: 600; text-align: left; transition: background-color .2s, color .2s, transform .15s var(--ease-out); }
.drawer nav button svg { width: 22px; height: 22px; flex: none; color: var(--brand); }
.drawer nav button span { flex: 1; } .drawer nav button small { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted); }
.drawer nav button .badge { flex: none; font-style: normal; min-width: 22px; padding: 0 7px; border-radius: 99px; background: var(--action); color: #fff; font-size: 12.5px; line-height: 22px; text-align: center; }
/* ---------- Planning (calendrier de révision) ---------- */
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
.cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.cal-head h3 { flex: 1; margin: 0; font-size: 20px; text-transform: capitalize; }
.cal-head .iconbtn { color: var(--brand); background: color-mix(in srgb, var(--brand) 8%, transparent); }
.cal-head .btn { min-height: 40px; padding: 6px 12px; background: color-mix(in srgb, var(--brand) 8%, transparent); color: var(--brand); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal-dow { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding-bottom: 2px; }
.cal-day { position: relative; min-height: 74px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); padding: 6px; display: grid; align-content: start; gap: 4px; text-align: left; color: var(--fg); transition: transform .15s var(--ease-out), border-color .2s, background-color .2s; }
.cal-day.out { opacity: .4; }
.cal-day b { font-size: 14px; font-weight: 700; }
.cal-day.today b { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--action); color: #fff; }
.cal-day.sel { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand) inset; background: color-mix(in srgb, var(--brand) 7%, var(--surface)); }
.cal-day:active { transform: scale(.96); }
.cal-dots { display: flex; flex-wrap: wrap; gap: 3px; }
.cal-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
.cal-dots i.done { background: var(--ok); }
.cal-day small { font-size: 11px; color: var(--muted); line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.plan-day { display: grid; gap: 10px; }
.plan-day h4 { margin: 0; font-size: 18px; } .plan-day h4::first-letter { text-transform: uppercase; }
.plan-list { display: grid; gap: 8px; }
.plan-item { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--pc, var(--brand)); border-radius: 12px; padding: 10px 12px; animation: slidein .3s var(--ease-out) both; }
.plan-item.done { opacity: .6; } .plan-item.done .pt { text-decoration: line-through; }
.plan-item .pchk { width: 30px; height: 30px; flex: none; border-radius: 50%; border: 2px solid var(--pc, var(--brand)); background: transparent; display: grid; place-items: center; color: #fff; transition: background-color .2s, transform .2s var(--ease-spring); }
.plan-item.done .pchk { background: var(--ok); border-color: var(--ok); transform: scale(1.08); }
.plan-item .pchk svg { width: 18px; height: 18px; }
.plan-item .pt { flex: 1; min-width: 0; display: grid; } .plan-item .pt b { font-size: 15.5px; } .plan-item .pt small { color: var(--muted); font-size: 13px; }
.plan-item .pgo { min-height: 38px; padding: 6px 12px; background: var(--brand); color: #fff; }
.plan-item .pdel { background: transparent; color: var(--muted); width: 38px; height: 38px; }
.plan-form { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.plan-form .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.plan-form label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.plan-form input, .plan-form select { font: inherit; font-size: 16px; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; min-height: 44px; padding: 8px 10px; }
.plan-form .kinds { display: flex; flex-wrap: wrap; gap: 6px; }
.plan-form .kinds button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; padding: 6px 12px; min-height: 38px; font-weight: 600; color: var(--fg); }
.plan-form .kinds button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.plan-empty { color: var(--muted); }
@media (max-width: 560px) { .cal-day { min-height: 54px; } .cal-day small { display: none; } }
.drawer nav button:hover { background: color-mix(in srgb, var(--brand) 8%, transparent); }
.drawer nav button:active { transform: scale(.98); }
.drawer nav button.on { background: var(--brand); color: #fff; } .drawer nav button.on svg, .drawer nav button.on small { color: #fff; }
.drawer.open nav button { animation: drawerItem .4s var(--ease-out) both; }
.drawer.open nav button:nth-child(2) { animation-delay: .04s; } .drawer.open nav button:nth-child(3) { animation-delay: .08s; } .drawer.open nav button:nth-child(4) { animation-delay: .12s; } .drawer.open nav button:nth-child(5) { animation-delay: .16s; } .drawer.open nav button:nth-child(6) { animation-delay: .2s; }
@keyframes drawerItem { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
.drawer-foot { color: var(--muted); font-size: 12.5px; padding: 12px 8px 0; border-top: 1px solid var(--line); }
/* ---------- animations ---------- */
:root { --ease-out: cubic-bezier(.22, 1, .36, 1); --ease-spring: cubic-bezier(.34, 1.56, .64, 1); }
#app > * { animation: pageIn .38s var(--ease-out) both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.home > * { animation: riseIn .5s var(--ease-out) both; }
.home > *:nth-child(2) { animation-delay: .04s; } .home > *:nth-child(3) { animation-delay: .08s; } .home > *:nth-child(4) { animation-delay: .12s; }
.home > *:nth-child(5) { animation-delay: .16s; } .home > *:nth-child(n+6) { animation-delay: .2s; }
@keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.cards > * { animation: cardIn .45s var(--ease-out) both; }
.cards > *:nth-child(1) { animation-delay: .12s; } .cards > *:nth-child(2) { animation-delay: .16s; } .cards > *:nth-child(3) { animation-delay: .2s; }
.cards > *:nth-child(4) { animation-delay: .24s; } .cards > *:nth-child(5) { animation-delay: .28s; } .cards > *:nth-child(6) { animation-delay: .32s; }
.cards > *:nth-child(7) { animation-delay: .36s; } .cards > *:nth-child(8) { animation-delay: .4s; } .cards > *:nth-child(n+9) { animation-delay: .44s; }
@keyframes cardIn { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
.exam, .m3d-days button, .m3d-legend button, .viewtabs button, .uepick button { transition: transform .2s var(--ease-out), box-shadow .2s var(--ease-out), background-color .2s, border-color .2s, color .2s; }
@media (hover: hover) and (pointer: fine) {
  .exam:hover { transform: translateY(-3px); box-shadow: 0 12px 28px color-mix(in srgb, var(--brand) 16%, transparent); border-color: color-mix(in srgb, var(--brand) 45%, var(--line)); }
}
.exam:active, .btn:active, .m3d-days button:active, .viewtabs button:active, .uepick button:active { transform: scale(.97); }
.btn { transition: transform .15s var(--ease-out), filter .15s, box-shadow .2s; }
.btn.orange:not(:disabled):hover, .btn.blue:not(:disabled):hover { filter: brightness(1.06); box-shadow: 0 6px 16px color-mix(in srgb, var(--brand) 22%, transparent); }
details[open] > :not(summary) { animation: slidein .28s var(--ease-out) both; }
.hans { animation: riseIn .4s var(--ease-out) both; }
.hans h4 { animation: popIn .45s var(--ease-spring) both; }
@keyframes popIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
.hans li, .m3d-ann li, .m3d-facts li { animation: slidein .3s var(--ease-out) both; }
.hans li:nth-child(2) { animation-delay: .05s; } .hans li:nth-child(3) { animation-delay: .1s; } .hans li:nth-child(n+4) { animation-delay: .15s; }
.hfig img.ok { animation: imgIn .5s var(--ease-out) both; }
@keyframes imgIn { from { opacity: 0; filter: blur(6px); transform: scale(.985); } to { opacity: 1; filter: none; transform: none; } }
.frise-wk > ol > li { animation: slidein .4s var(--ease-out) both; }
.frise-wk > ol > li::before { transition: transform .25s var(--ease-spring), background-color .2s; }
.frise-wk > ol > li:has(details[open])::before { transform: scale(1.35); background: var(--brand); }
.m3d-zoom { animation: fadeIn .2s ease-out both; } .m3d-zoom img { animation: popIn .35s var(--ease-out) both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.m3d-info { transition: background-color .25s; }
.hobj { display: grid; gap: 10px; }
.hobj summary { cursor: pointer; min-height: 30px; }
.hobj p { margin: 6px 0 0; }
.hgrade { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.hgrade .hok { background: var(--ok); color: #fff; } .hgrade .hbad { background: var(--bad); color: #fff; }
.hgrade .btn:not(.hok):not(.hbad):not(.blue):not(.orange) { background: var(--surface-2, var(--surface)); border: 1px solid var(--line); }
/* ===== Thème 3 : « cahier de révision » — papier, encre, serif pour les titres ; pas de dégradés ni de halos ===== */
:root {
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --bg: #f6f3ec; --surface: #fffdf8; --surface-2: #f1ede4; --fg: #22252a; --muted: #6a6d72; --line: #e3ddd1;
  --brand: #2c5d8a; --action: #c4572a; --action-ink: #fff;
  --ok: #2f7d4f; --ok-soft: #e6f1e8; --bad: #b8433f; --bad-soft: #f8e4e1; --mid: #b7791f; --mid-soft: #f6ecd8;
  --radius: 8px;
  --shadow: 0 1px 0 rgba(34, 37, 42, .04);
  --shadow-up: 0 2px 8px rgba(34, 37, 42, .07);
}
:root[data-ue="UE1"] { --brand: #2f6f62; } :root[data-ue="UE2"] { --brand: #6b4f8a; } :root[data-ue="UE4"] { --brand: #2c5d8a; }
:root[data-ue="UE5"] { --brand: #9c3d4f; } :root[data-ue="UE6"] { --brand: #a35a1f; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1917; --surface: #22211e; --surface-2: #2a2825; --fg: #ece8e0; --muted: #a39f97; --line: #36342f;
    --ok: #6fbf8a; --ok-soft: #1f2c22; --bad: #e07d76; --bad-soft: #352220; --mid: #d9a54f; --mid-soft: #33291a;
    --shadow: none; --shadow-up: 0 2px 10px rgba(0, 0, 0, .35);
  }
}
:root[data-theme="dark"] {
  --bg: #1a1917; --surface: #22211e; --surface-2: #2a2825; --fg: #ece8e0; --muted: #a39f97; --line: #36342f;
  --ok: #6fbf8a; --ok-soft: #1f2c22; --bad: #e07d76; --bad-soft: #352220; --mid: #d9a54f; --mid-soft: #33291a;
  --shadow: none; --shadow-up: 0 2px 10px rgba(0, 0, 0, .35);
}
body { background: var(--bg); font-family: var(--font); font-size: 16.5px; letter-spacing: 0; }
h1, h2, h3, h4, .exam .t, .scorehead .big, .splash-name, .drawer-head b, .cal-head h3, .plan-day h4, .hans h4 { letter-spacing: -.005em; }
body::before, .topbar { background: color-mix(in srgb, var(--brand) 82%, #111); }
.topbar { box-shadow: none; border-bottom: 1px solid rgba(0, 0, 0, .12); }

/* ---------- araignée de compétences : un axe par matière (ou par chapitre si l'UE a moins de 3 matières) ---------- */
const RANKS = [['S', 90], ['A', 80], ['B', 70], ['C', 60], ['D', 50], ['E', 40], ['F', 30], ['G', 0]];
const rankOf = v => RANKS.find(r => v >= r[1])[0];
function skillHTML() {
  const qres = store.get('qres', {});
  /* un axe par UE : toutes les questions notables de l'UE (annales + documents importés dans cette UE) */
  let axes = UES.map(u => ({ nom: u, keys: BASE.concat(IMPORTS.filter(e => e.ue)).filter(e => ueOf(e) === u).flatMap(e => e.questions.map((q, k) => scorable(q) ? [e.id, k] : null).filter(Boolean)) }));
  if (axes.length < 3) return '';
  axes = axes.map(a => {
    let pts = 0, done = 0;
    a.keys.forEach(([e, k]) => { const r = qres[e + '#' + k]; if (r) { done++; pts += r.p; } });
    const need = Math.min(20, a.keys.length);            // note complète à partir de 20 questions faites
    const score = done ? Math.round(100 * (pts / done) * Math.min(1, done / need)) : 0;
    return { nom: a.nom, n: a.keys.length, done, score, rank: rankOf(score) };
  });
  const total = Math.round(axes.reduce((t, a) => t + a.score, 0) / axes.length), tRank = rankOf(total);
  const N = axes.length, small = N > 8, W = small ? 680 : 520, H = 440, cx = W / 2, cy = H / 2, R = 120;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / N;
  const pt = (i, v) => [cx + Math.cos(ang(i)) * R * v, cy + Math.sin(ang(i)) * R * v];
  const P = f => axes.map((a, i) => pt(i, f(a, i)).map(x => x.toFixed(1)).join(',')).join(' ');
  const rings = [.25, .5, .75].map(v => `<polygon points="${P(() => v)}" class="ring"/>`).join('');
  const spokes = axes.map((a, i) => { const [x, y] = pt(i, 1); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="ring"/>`; }).join('');
  const wrap = t => { const out = ['']; t.split(' ').forEach(x => { const c = (out[out.length - 1] + ' ' + x).trim(); if (c.length > 16 && out[out.length - 1]) out.push(x); else out[out.length - 1] = c; }); return out.slice(0, 3); };
  const labels = axes.map((a, i) => {
    const c = Math.cos(ang(i)), sn = Math.sin(ang(i));
    const [x, y] = pt(i, small ? 1.17 : 1.3);
    const anchor = Math.abs(c) < .2 ? 'middle' : c > 0 ? 'start' : 'end';
    const lines = wrap(a.nom); const y0 = small ? y - (sn < -.3 ? (lines.length - 1) * 13 : sn > .3 ? -10 : (lines.length - 1) * 6.5 - 4) : y - (sn < -.3 ? lines.length * 13 + 22 : sn > .3 ? -8 : (lines.length - 1) * 6.5 + 14);
    const bx = anchor === 'middle' ? x : anchor === 'start' ? x + 14 : x - 14;
    return `<text x="${x.toFixed(1)}" y="${y0.toFixed(1)}" text-anchor="${anchor}" class="lbl">${lines.map((l, k) => `<tspan x="${x.toFixed(1)}" dy="${k ? 13 : 0}">${esc(l)}${small && k === lines.length - 1 ? ` <tspan class="inl r${a.rank}">${a.rank} ${a.score}</tspan>` : ''}</tspan>`).join('')}</text>
      ${small ? '' : `<text x="${(small ? x : bx).toFixed(1)}" y="${(y0 + lines.length * 13 + (small ? 4 : 16)).toFixed(1)}" text-anchor="${small ? anchor : 'middle'}" class="rk r${a.rank}">${a.rank}</text>`}`;
  }).join('');
  const vals = small ? '' : axes.map((a, i) => { const [x, y] = pt(i, Math.max(.2, Math.min(.86, a.score / 100 - .13))); return `<text x="${x.toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="middle" class="val">${a.score}</text>`; }).join('');
  const anyDone = axes.some(a => a.done);
  return `<section class="group"><h3>Mes compétences</h3>
    <div class="skill">
      <div class="skillcard">
        <div class="sc-name">PASS</div>
        <div class="sc-lbl">TOTAL</div>
        <div class="sc-total">${total}</div>
        <div class="sc-rank r${tRank}">${tRank}</div>
        <ul class="sc-scale">${RANKS.map((r, k) => `<li class="${r[0] === tRank ? 'cur' : ''}"><b>${r[0]}</b><span>${r[1]} – ${k ? RANKS[k - 1][1] - 1 : 100}</span></li>`).join('')}</ul>
      </div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Araignée de compétences : ${axes.map(a => `${esc(a.nom)} ${a.score} sur 100, rang ${a.rank}`).join(' ; ')}">
        <polygon points="${P(() => 1.09)}" class="outer"/><polygon points="${P(() => 1)}" class="frame"/>
        ${rings}${spokes}
        <polygon points="${P(a => Math.max(.03, a.score / 100))}" class="mast"/>
        ${vals}${labels}
      </svg>
      <div class="note-src skillnote">${anyDone ? '' : 'Faites une première série : l’araignée se remplit au fur et à mesure. '}Note sur 100 par UE : réussite sur les questions déjà faites (dernier essai de chaque question). La note complète demande au moins 20 questions faites dans l’UE.</div>
    </div></section>`;
}
function bdqHTML() {

/* ---------- déménagement vers un nouveau domaine ----------

const MOVE_TO = 'https://reussir-pass.fr';
function moveBanner() {

  const host = new URL(MOVE_TO).host;
  const bar = document.createElement('div'); bar.id = 'moveBar'; bar.className = 'movebar wrap';
  bar.innerHTML = `<div><b>Le site déménage : ${esc(host)}</b><span>Touchez le bouton pour y emporter votre progression (résultats, flashcards, documents importés). Ajoutez ensuite la nouvelle adresse à votre écran d’accueil.</span></div><button class="btn orange" id="moveGo">Emporter ma progression</button>`;
  app.prepend(bar);
  $('#moveGo').onclick = async () => {
    const json = JSON.stringify(window.UE4Import.progressData());

    try { if (window.CompressionStream) { const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer(); let bin = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 8192) bin += String.fromCharCode.apply(null, u.subarray(i, i + 8192)); payload = 'z' + btoa(bin); } } catch (e) {}

async function receiveTransfer() {
  const m = location.hash.match(/^#transfert=(.+)$/); if (!m) return;
  history.replaceState(null, '', location.pathname);
  try {
    const p = decodeURIComponent(m[1]); let json;
    if (p[0] === 'z') { const bin = atob(p.slice(1)); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); json = await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); }
    else json = decodeURIComponent(escape(atob(p.slice(1))));
    const obj = JSON.parse(json); const n = await window.UE4Import.applyProgress(obj, false);
    toast('Progression transférée' + (n ? ` (+ ${n} document${n > 1 ? 's' : ''})` : '')); setTimeout(() => location.reload(), 900);

function recordResult(eid, k, r) {
  if (!r) return;
  const all = store.get('qres', {});
  const id = eid + '#' + k, prev = all[id] || { n: 0 };
  all[id] = { p: r.pts, n: prev.n + 1, t: Date.now(), w: (prev.w || 0) + (r.pts < 1 ? 1 : 0) };

function revisionSets() {
  const all = store.get('qres', {});
  const wrong = [], never = [];
  let done = 0, perfect = 0;
  pool().forEach(e => e.questions.forEach((q, k) => {
    if (!scorable(q)) return;
    const r = all[e.id + '#' + k];
    if (!r) never.push([e.id, k]);

  return { wrong, never, done, perfect };
}
function searchQuestions(term) {
  const n = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const words = n(term).split(/\s+/).filter(w => w.length > 1);
  if (!words.length) return [];
  const out = [];
  pool().forEach(e => e.questions.forEach((q, k) => {
    const hay = n([q.context, q.stem, ...q.items.map(i => i.text)].join(' '));
    if (words.every(w => hay.includes(w))) out.push([e.id, k]);
  }));
  return out;
}

    row.addEventListener('click', ev => {
      ev.preventDefault();

      if (multi) cur = cur.includes(L) ? cur.filter(x => x !== L) : [...cur, L];

  app.querySelectorAll('.tk').forEach(c => {
    const k = c.dataset.k, l = byQ[k], { q } = qInfo(k), orig = (l[0].original && l[0].original.length ? l[0].original : q.answer) || [];
    c.querySelectorAll('[data-tkok]').forEach(b => b.onclick = async () => { const a = b.dataset.tkok === 'aucune' ? [] : b.dataset.tkok.split(' '); if (!confirm(`Appliquer la réponse « ${b.dataset.tkok} » à tous les comptes ?`)) return; try { await window.Compte.decide(k, 'validée', a, orig); after('Correction validée pour tous.'); } catch (e) { toast('Échec : ' + (e.message || e)); } });
    c.querySelector('[data-tkno]').onclick = async () => { try { await window.Compte.decide(k, 'rejetée', null, orig); after('Ticket rejeté.'); } catch (e) { toast('Échec : ' + (e.message || e)); } };
  });
  app.querySelectorAll('[data-tkundo]').forEach(b => b.onclick = async () => { if (!confirm('Annuler cette correction pour tous les comptes ?')) return; try { await window.Compte.undecide(b.dataset.tkundo); after('Correction annulée.'); } catch (e) { toast('Échec : ' + (e.message || e)); } });
  window.scrollTo(0, 0);
}
/* ---------- correction de la réponse attendue par l'élève ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-fix]'); if (!b || !b.dataset.fix) return;
  const row = b.closest('.fixrow'), wrap = row && row.previousElementSibling; if (!wrap || !wrap.classList.contains('tblwrap')) return;
  const qk = b.dataset.fix, i = qk.lastIndexOf('#'), q = findQ(qk.slice(0, i), +qk.slice(i + 1)); if (!q) return;
  const set = new Set(q.answer || []);
  wrap.classList.add('fixing');
  // encadré « Correction » : verdict recalculé en direct + texte modifiable pour chaque item
  const det = row.nextElementSibling, dl = det && det.querySelector('.dl');
  const orig = L => (((q.corrections || {})[L] || {}).text || '');
  const verdicts = () => { if (dl) dl.querySelectorAll('[data-dl]').forEach(s => { const on = set.has(s.dataset.dl); s.className = 'vf ' + (on ? 'V' : 'F'); s.textContent = s.dataset.dl + ' ' + (on ? 'VRAI' : 'FAUX'); }); };
  if (dl) { det.classList.add('fixing'); dl.querySelectorAll('[data-dl]').forEach(s => { const L = s.dataset.dl, tx = s.nextElementSibling, cur = q.ctext && q.ctext[L] != null ? q.ctext[L] : orig(L); tx.innerHTML = `<textarea class="fixtx" data-tx="${esc(L)}" rows="2" aria-label="Correction de l’item ${esc(L)}">${esc(cur)}</textarea>`; }); verdicts(); }
  wrap.querySelectorAll('tbody tr').forEach(tr => {
    const L = tr.querySelector('td.L').textContent.trim(), td = tr.children[1];
    const draw = () => { td.innerHTML = `<button class="ck fixck ${set.has(L) ? 'on' : ''}" aria-pressed="${set.has(L)}" aria-label="Item ${esc(L)} juste">${set.has(L) ? CHECK : ''}</button>`; td.firstChild.onclick = () => { set.has(L) ? set.delete(L) : set.add(L); draw(); verdicts(); }; };
    draw();
  });
  row.innerHTML = `<span class="fixnote">Cochez les items justes et modifiez si besoin les explications dans l’encadré « Correction », puis enregistrez. Visible seulement par vous.</span><button class="btn blue" data-fixsave>Enregistrer</button>${q.fixSrc === 'perso' ? '<button class="btn" data-fixreset>Rétablir</button>' : ''}<button class="btn" data-fixcancel>Annuler</button>`;
  const done = F => { store.set('fix', F); applyFixes(); const y = window.scrollY; if (S && S.qs && document.querySelector('.scorehead')) renderCorrection(S); else if (S) renderExam(); else if (AN && view === 'ses') anRender(); window.scrollTo(0, y); };
  row.querySelector('[data-fixsave]').onclick = () => {
    const F = store.get('fix', {}), base = q.fixSrc === 'perso' ? (q.answer0 || []) : (q.answer || []), src = (q.fixSrc ? q.answer0 : q.answer) || [], a = [...set].sort();
    const cur = (q.fixSrc === 'global' ? q.answer : base).slice().sort().join('');
    const c = {}; if (dl) dl.querySelectorAll('[data-tx]').forEach(t => { const v = t.value.trim(); if (v !== orig(t.dataset.tx).trim()) c[t.dataset.tx] = v; });
    const hasC = Object.keys(c).length, ansChanged = a.join('') !== cur || (q.fixSrc === 'perso' && a.join('') !== src.slice().sort().join(''));
    if (!hasC && a.join('') === src.slice().sort().join('')) delete F[qk];
    else if (!hasC && !ansChanged) delete F[qk];
    else F[qk] = Object.assign({ a, t: Date.now() }, hasC ? { c } : {});
    done(F);
    if (window.Compte && window.Compte.user) { if (F[qk] && a.join('') !== src.slice().sort().join('')) window.Compte.pushFix(qk, a, src.slice().sort()); else window.Compte.delFix(qk); }
    toast(F[qk] ? 'Correction enregistrée pour vous.' : 'Aucune différence : rien à enregistrer.');
  };
  const rs = row.querySelector('[data-fixreset]'); if (rs) rs.onclick = () => { const F = store.get('fix', {}); delete F[qk]; done(F); if (window.Compte && window.Compte.user) window.Compte.delFix(qk); toast('Correction retirée.'); };
  row.querySelector('[data-fixcancel]').onclick = () => done(store.get('fix', {}));
});
/* ---------- correction ---------- */
function correctionHtml(q, sel, res) {
  const has = q.items && q.items.length;
  const s = new Set(sel || []);
  return `${has && res ? `<div class="verdict ${cls(res)}"><span>${res.pts >= 1 ? 'Réponses parfaitement correctes' : res.empty ? 'Pas de réponse' : res.pts > 0 ? 'Réponses partiellement correctes' : 'Réponses incorrectes'}</span><span>${fmt(res.pts)} point${res.pts > 1 ? 's' : ''} obtenu${res.pts > 1 ? 's' : ''} sur 1</span></div>` : ''}
    ${q.status === 'annulée' ? '<div class="annul">Question annulée : non comptée</div>' : ''}
    ${has ? `<div class="tblwrap"><table class="cor"><thead><tr><th></th><th>Réponse attendue</th><th>Réponse saisie</th><th>Réponse discordante</th><th style="text-align:left">Item</th></tr></thead><tbody>
      ${q.items.map(it => {
        const exp = (q.answer || []).includes(it.letter), got = s.has(it.letter), dis = exp !== got;
        return `<tr><td class="L">${esc(it.letter)}</td><td><span class="ck ${exp ? 'on' : ''}">${exp ? CHECK : ''}</span></td><td><span class="ck ${got ? 'on' : ''}">${got ? CHECK : ''}</span></td>
          <td class="${dis ? 'dis-yes' : 'dis-no'}">${dis ? 'Oui (+1)' : 'Non'}</td><td class="txt">${esc(it.text)}</td></tr>`;
      }).join('')}</tbody></table></div>
      <div class="fixrow">${q.answer0 ? `<span class="fixnote">${q.fixSrc === 'global' ? 'Réponse attendue corrigée après vérification' : 'Réponse attendue corrigée par vous'} (original : ${esc(q.answer0.join(' ') || 'aucune')})</span>` : ''}<button class="fixbtn" data-fix="${esc(q._k || '')}">✎ ${q.fixSrc === 'perso' ? 'Modifier ma correction' : 'Corriger la réponse attendue'}</button></div>` : ''}
    <div class="detail"><h4>Correction</h4>
      ${has ? `<div class="dl">${q.items.map(it => {
        const c = (q.corrections || {})[it.letter] || {};
        const vd = q.answer0 ? ((q.answer || []).includes(it.letter) ? 'VRAI' : 'FAUX') : (c.verdict || ''), v = vd.toUpperCase();
        const own = q.ctext && q.ctext[it.letter] != null, tx = own ? q.ctext[it.letter] : (c.text || '');
        return `<span class="vf ${v.startsWith('V') ? 'V' : v.startsWith('F') ? 'F' : ''}" data-dl="${esc(it.letter)}">${esc(it.letter)} ${esc(vd)}</span><span class="tx">${esc(tx)}${own ? ' <small class="fixmine">(modifié par vous)</small>' : ''}</span>`;
      }).join('')}</div>` : ''}
      ${q.general ? `<div class="general">${esc(q.general)}</div>` : ''}
      ${figHtml(q.correctionFigures)}
      ${q.notes ? `<div class="notes">Remarque : ${esc(q.notes)}</div>` : ''}
    </div>`;
}

function renderCorrection(done) {
  S = done;
  $('#menuBtn').hidden = false; $('#homeBtn').hidden = false;
  $('#barTitle').textContent = done.title;
  let pts = 0, max = 0;
  const rows = done.qs.map((pair, i) => {
    const q = findQ(pair[0], pair[1]);
    const r = grade(q, done.saved[key(i)]);
    if (r) { pts += r.pts; max += 1; }
    if (r && !(done.mode === 'train' && done.revealed[key(i)])) recordResult(pair[0], pair[1], r);
    return { q, r, i };
  });
  const note = max ? pts / max * 20 : 0;
  if (done.examId !== 'mix') {
    const hist = store.get('hist', {});
    const h = hist[done.examId] || { best: 0 };
    hist[done.examId] = { last: note, best: Math.max(h.best || 0, note), at: Date.now() };
    store.set('hist', hist);
  }
  const wrong = rows.filter(x => x.r && x.r.pts < 1).map(x => done.qs[x.i]);
  const mins = Math.round((done.elapsed || 0) / 60000);
  app.innerHTML = `<div class="layout wrap">
    <aside class="rail" id="rail">
      <div class="panel"><div class="who">Copie corrigée</div><div class="timer"><b>${mins} min</b> de composition</div>
        <button class="btn orange block" data-redo>Recommencer</button>
        ${wrong.length ? `<button class="btn blue block" data-wrong>Refaire mes erreurs (${wrong.length})</button>` : ''}
        <button class="btn ghost block" data-home>Autres épreuves</button></div>
      <div class="panel qlist">${`<div class="sec"><span>Questions isolées</span><span>QI</span></div>` + rows.map(x => `<button class="qlink res-${cls(x.r)}" data-go="${x.i}"><span>${esc(qTitle(x.i))}</span><small>${x.r ? fmt(x.r.pts) : '–'}</small></button>`).join('')}</div>
    </aside>
    <main class="main">
      <div class="scorehead"><span class="big">${fmt(note)} <small>/20</small></span><span class="s">${fmt(pts)} point${pts > 1 ? 's' : ''} sur ${max} question${max > 1 ? 's' : ''} notée${max > 1 ? 's' : ''}</span><span class="s">${rows.filter(x => x.r && x.r.pts >= 1).length} parfaites · ${rows.filter(x => x.r && x.r.pts > 0 && x.r.pts < 1).length} partielles · ${rows.filter(x => x.r && x.r.pts === 0).length} à zéro</span></div>
      <h2>Questions isolées</h2>
      ${done.intro ? `<div class="intro">${esc(done.intro)}</div>` : ''}
      ${rows.map(({ q, r, i }) => `<article class="q r-${cls(r)}" id="q${i}">
        <div class="qh"><span class="num">${INFO}${esc(qTitle(i))} <span class="ptsbadge">${r ? fmt(r.pts) + ' pt' : 'non notée'}</span></span><span class="ty">${q.type === 'QRU' ? 'Question à réponse unique' : 'Question à réponses multiples'}</span></div>
        <div class="qb">${srcLabel(i) ? `<div class="note-src">${esc(srcLabel(i))}</div>` : ''}
          ${q.context ? `<div class="ctx">${esc(q.context)}</div>` : ''}
          <div class="stem">${esc(q.stem)}</div>${figHtml(q.figures)}
          ${correctionHtml(q, done.saved[key(i)], r)}</div></article>`).join('')}
    </main></div>`;
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { closeRail(); $('#q' + b.dataset.go).scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  app.querySelectorAll('.figs img').forEach(img => img.onclick = () => zoom(img.src));
  $('[data-redo]').onclick = () => done.examId === 'mix' ? startList(done.title, done.qs) : startExam(done.examId);
  const w = $('[data-wrong]'); if (w) w.onclick = () => startList(`Mes erreurs · ${done.title}`, wrong);
  $('[data-home]').onclick = home;
  const big = $('.scorehead .big');
  if (big && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const t0 = performance.now(), D = 600;
    const step = now => { const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3); big.firstChild.textContent = fmt(note * e) + ' '; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  window.scrollTo(0, 0);
}

/* ---------- misc ---------- */
function zoom(src) {
  const z = document.createElement('div'); z.className = 'zoom';
  z.innerHTML = `<img src="${esc(src)}" alt="Figure agrandie">`;
  z.onclick = () => z.remove();
  document.body.appendChild(z);
}
function toast(t) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = t;
  document.body.appendChild(el); setTimeout(() => el.remove(), 1400);
}
function openRail() { const r = $('#rail'); if (!r) return; r.classList.add('open'); const s = document.createElement('div'); s.className = 'scrim'; s.id = 'scrim'; s.onclick = closeRail; document.body.appendChild(s); }
function closeRail() { const r = $('#rail'); if (r) r.classList.remove('open'); const s = $('#scrim'); if (s) s.remove(); }
$('#menuBtn').onclick = () => { const r = $('#rail'); r && r.classList.contains('open') ? closeRail() : openRail(); };
$('#homeBtn').onclick = () => {
  if (S && !$('.scorehead')) {
    persist();
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="dialog"><h3>Quitter l’épreuve ?</h3><p style="margin:0">Vos réponses sont gardées sur cet appareil : vous pourrez reprendre depuis l’accueil.</p><div class="row"><button class="btn ghost" data-x>Rester</button><button class="btn blue" data-ok>Retour à l’accueil</button></div></div>`;
    document.body.appendChild(m);
    m.querySelector('[data-x]').onclick = () => m.remove();
    m.querySelector('[data-ok]').onclick = () => { m.remove(); home(); };
  } else home();
};
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
/* clavier (iPad avec clavier, ordinateur) : A–E coche, Entrée enregistre, ↑/↓ change de question */
function currentCard() {
  const cards = [...document.querySelectorAll('#main > .q')];
  return cards.find(c => c.getBoundingClientRect().bottom > 140) || cards[0];
}
document.addEventListener('keydown', e => {
  if (!S || !$('#main') || document.querySelector('.modal, .zoom')) return;
  if (e.target.closest && e.target.closest('input, textarea, select')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const card = currentCard(); if (!card) return;
  const k = e.key.length === 1 ? e.key.toUpperCase() : e.key;
  if (/^[A-G]$/.test(k)) {
    const row = card.querySelector(`.item[data-l="${k}"]`);
    if (row) { e.preventDefault(); row.click(); }
  } else if (k === 'Enter') {
    const b = card.querySelector('[data-save], [data-reveal]');
    if (b) { e.preventDefault(); b.click(); }
  } else if (k === 'ArrowDown' || k === 'ArrowUp') {
    const sib = k === 'ArrowDown' ? card.nextElementSibling : card.previousElementSibling;
    if (sib && sib.classList.contains('q')) { e.preventDefault(); sib.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  }
});
window.UE4 = {
  esc, toast, home, confirmBox, app, $, CHECK,
  setImports(list) { IMPORTS = list; rebuild(); },
  getImports() { return IMPORTS; },
  currentUe() { return ue; }, ues() { return UES.slice(); },
  bdqMatieres(u) { const B = (window.BDQ || {})[u]; return B ? B.matieres : []; },
  suggestBdq,
  setTitle(t) { $('#barTitle').textContent = t; $('#homeBtn').hidden = false; $('#menuBtn').hidden = true; S = null; stopTimer(); }
};
home();
if (window.UE4Import) Promise.resolve(window.UE4Import.init()).then(receiveTransfer).then(() => window.Compte && window.Compte.init());
})();
</script>
